<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>{% block title %}WebSpector - Agentic AI for Automated Website QA{% endblock %}</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
    
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class", 
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed": "#23005c", 
                        "primary-container": "#8083ff", 
                        "primary-fixed-dim": "#c0c1ff", 
                        error: "#ffb4ab", 
                        background: "#0b1326", 
                        "on-tertiary": "#00344d", 
                        "secondary-fixed": "#e9ddff", 
                        "primary-fixed": "#e1e0ff", 
                        "on-background": "#dae2fd", 
                        surface: "#0b1326", 
                        "on-secondary-fixed-variant": "#5516be", 
                        "on-primary": "#1000a9", 
                        "surface-container-highest": "#2d3449", 
                        "on-error": "#690005", 
                        "on-tertiary-container": "#002d43", 
                        "inverse-on-surface": "#283044", 
                        secondary: "#d0bcff", 
                        "on-secondary-container": "#c4abff", 
                        tertiary: "#89ceff", 
                        "on-primary-fixed-variant": "#2f2ebe", 
                        "tertiary-container": "#009ada", 
                        "on-error-container": "#ffdad6", 
                        "surface-variant": "#2d3449", 
                        "surface-tint": "#c0c1ff", 
                        "on-primary-container": "#0d0096", 
                        "surface-container": "#171f33", 
                        "tertiary-fixed-dim": "#89ceff", 
                        "secondary-container": "#571bc1", 
                        "inverse-surface": "#dae2fd", 
                        "inverse-primary": "#494bd6", 
                        "tertiary-fixed": "#c9e6ff", 
                        "on-tertiary-fixed": "#001e2f", 
                        "on-primary-fixed": "#07006c", 
                        "secondary-fixed-dim": "#d0bcff", 
                        "on-tertiary-fixed-variant": "#004c6e", 
                        "on-surface": "#dae2fd", 
                        "on-secondary": "#3c0091", 
                        "surface-dim": "#0b1326", 
                        primary: "#c0c1ff", 
                        outline: "#908fa0", 
                        "surface-container-low": "#131b2e", 
                        "surface-bright": "#31394d", 
                        "surface-container-lowest": "#060e20", 
                        "error-container": "#93000a", 
                        "on-surface-variant": "#c7c4d7", 
                        "surface-container-high": "#222a3d", 
                        "outline-variant": "#464554"
                    }, 
                    borderRadius: {DEFAULT: "0.25rem", lg: "0.5rem", xl: "0.75rem", full: "9999px"}, 
                    fontFamily: {headline: ["Inter"], body: ["Inter"], label: ["Inter"], display: "Inter"}
                }
            }
        };
    </script>
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b1326;
            color: #dae2fd;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col selection:bg-primary-container selection:text-on-primary-container">
    <!-- TopNavBar Shell -->
    <header class="bg-slate-950/80 backdrop-blur-2xl text-indigo-400 font-sans text-sm font-medium tracking-wide docked full-width top-0 sticky z-50 h-20 shadow-[0_8px_30px_rgb(99,102,241,0.04)]">
        <div class="flex justify-between items-center w-full px-12 max-w-[1920px] mx-auto h-full">
            <div class="flex items-center gap-12">
                <a href="{{ url_for('dashboard_home', token=token) }}" class="text-2xl font-black tracking-tighter bg-gradient-to-r from-indigo-300 to-purple-300 bg-clip-text text-transparent">WebSpector</a>
                <nav class="hidden md:flex gap-8">
                    <a class="{% if request.endpoint == 'dashboard_home' %}text-indigo-300 border-b-2 border-indigo-500/40{% else %}text-slate-400{% endif %} hover:text-indigo-200 transition-colors duration-300 ease-in-out active:scale-[0.98] hover:bg-indigo-500/5 rounded-lg pb-1" href="{{ url_for('dashboard_home', token=token) }}">Dashboard</a>
                    <a class="{% if request.endpoint == 'run_test_page' %}text-indigo-300 border-b-2 border-indigo-500/40{% else %}text-slate-400{% endif %} hover:text-indigo-200 transition-colors duration-300 ease-in-out active:scale-[0.98] hover:bg-indigo-500/5 rounded-lg pb-1" href="{{ url_for('run_test_page', token=token) }}">Run Test</a>
                    <a class="{% if request.endpoint == 'list_sessions' %}text-indigo-300 border-b-2 border-indigo-500/40{% else %}text-slate-400{% endif %} hover:text-indigo-200 transition-colors duration-300 ease-in-out active:scale-[0.98] hover:bg-indigo-500/5 rounded-lg pb-1" href="{{ url_for('list_sessions', token=token) }}">Sessions</a>
                </nav>
            </div>
            <div class="flex items-center gap-6">
                <div class="flex items-center gap-4">
                    <button class="material-symbols-outlined text-slate-400 hover:text-indigo-200 transition-all">notifications</button>
                    <button class="material-symbols-outlined text-slate-400 hover:text-indigo-200 transition-all">settings</button>
                </div>
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-indigo-500/20">
                    <img alt="User profile" src="{{ url_for('static', filename='profile.png') or '/static/profile.png' }}"/>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col relative overflow-hidden">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer Shell -->
    <footer class="bg-slate-950 w-full py-12 mt-auto flex flex-col md:flex-row justify-between items-center px-12 border-t border-white/5">
        <div class="mb-6 md:mb-0">
            <span class="text-indigo-500 font-bold tracking-tight">WebSpector AI.</span>
            <span class="font-sans text-xs uppercase tracking-widest text-slate-500 ml-2">Precision Orchestration.</span>
        </div>
        <div class="flex gap-8">
            <a class="font-sans text-xs uppercase tracking-widest text-slate-500 hover:text-indigo-200 transition-colors opacity-80 hover:opacity-100" href="#">API Docs</a>
            <a class="font-sans text-xs uppercase tracking-widest text-slate-500 hover:text-indigo-200 transition-colors opacity-80 hover:opacity-100" href="#">System Status</a>
            <a class="font-sans text-xs uppercase tracking-widest text-slate-500 hover:text-indigo-200 transition-colors opacity-80 hover:opacity-100" href="#">Security</a>
            <a class="font-sans text-xs uppercase tracking-widest text-slate-500 hover:text-indigo-200 transition-colors opacity-80 hover:opacity-100" href="#">Support</a>
        </div>
        <div class="mt-6 md:mt-0">
            <p class="font-sans text-xs uppercase tracking-widest text-slate-500">© 2024 WebSpector AI. Precision Orchestration.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
